<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Mama's Grill — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#150f0b;
    --charcoal:#1d1611;
    --brown:#33271b;
    --brown-light:#4d3c28;
    --red:#d62a1a;
    --red-dark:#8c1c10;
    --orange:#ff6b00;
    --orange-light:#ffab4d;
    --cream:#efe0bf;
    --text:#f5ecd9;
    --text-dim:#bfa987;
    --radius:14px;
    --paper:#f6efe1;
    --paper-line:#e3d6b8;
    --text-on-paper:#2a1d12;
    --text-on-paper-dim:#6b5a3f;
    --gold:#e8b923;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  body.login-mode{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0 0 6px;
    font-size:28px;
    color:var(--cream);
  }
  .card{
    background:var(--charcoal);
    border:1px solid var(--brown-light);
    border-radius:16px;
    padding:36px 32px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .eyebrow{
    font-weight:700;
    font-size:12.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:10px;
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 26px;
  }
  input[type="password"]{
    width:100%;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--brown-light);
    background:var(--brown);
    color:var(--text);
    font-size:16px;
    margin-bottom:16px;
  }
  input[type="password"]:focus{
    outline:none;
    border-color:var(--orange);
  }
  button{
    width:100%;
    padding:14px 16px;
    border-radius:10px;
    border:none;
    background:var(--orange);
    color:#fff;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  button:hover{
    background:var(--orange-light);
  }
  button:disabled{
    opacity:0.6;
    cursor:default;
  }
  .error{
    color:#ff9d8a;
    font-size:14px;
    margin-top:14px;
    min-height:18px;
  }
  .dashboard-placeholder{
    display:none;
  }
  .dashboard{
    max-width:1000px;
    margin:0 auto;
    padding:24px;
    min-height:100vh;
  }
  .dash-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .btn-secondary{
    background:var(--brown-light);
    color:var(--text);
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
  }
  .dash-body{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .dash-nav{
    background:var(--charcoal);
    border:1px solid var(--brown-light);
    border-radius:12px;
    padding:10px;
    min-width:200px;
    flex-shrink:0;
  }
  .dash-nav button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text-dim);
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:2px;
  }
  .dash-nav button:hover{
    background:var(--brown);
    color:var(--text);
  }
  .dash-nav button.active{
    background:var(--orange);
    color:#fff;
  }
  .dash-content{
    flex:1;
    min-width:280px;
    background:var(--charcoal);
    border:1px solid var(--brown-light);
    border-radius:12px;
    padding:24px;
  }
  .field-group{
    margin-bottom:18px;
  }
  .field-label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field-group input[type="text"],
  .field-group textarea{
    width:100%;
    padding:11px 13px;
    border-radius:8px;
    border:1px solid var(--brown-light);
    background:var(--brown);
    color:var(--text);
    font-size:14.5px;
    font-family:inherit;
  }
  .field-group textarea{
    min-height:80px;
    resize:vertical;
  }
  .field-group input:focus,
  .field-group textarea:focus{
    outline:none;
    border-color:var(--orange);
  }
  .item-block{
    border:1px solid var(--brown-light);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
    background:var(--ink);
  }
  .item-block-label{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:10px;
    font-weight:700;
  }
  .save-btn{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:8px;
  }
  .save-btn:hover{
    background:var(--orange-light);
  }
  .save-btn:disabled{
    opacity:0.6;
    cursor:default;
  }
  .save-banner{
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--orange);
    color:#fff;
    padding:14px 20px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    display:none;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .save-banner.error-banner{
    background:#a52a1e;
  }

  /* ---- Visual Menu Editor (mirrors the real live-site styling) ---- */
  .menu-visual-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:20px;
    margin-bottom:24px;
  }
  .menu-visual-card{
    background:var(--brown);border:1px solid var(--brown-light);border-radius:var(--radius);
    padding:26px 24px 24px;display:flex;flex-direction:column;
  }
  .menu-visual-torn{
    position:relative;
    display:inline-block;
    padding:9px 22px 11px;
    background:linear-gradient(100deg,var(--red) 0%, var(--orange) 100%);
    clip-path:polygon(1.5% 18%, 4% 4%, 22% 11%, 38% 1%, 55% 9%, 72% 2%, 90% 10%, 99% 0%, 100% 32%, 97% 52%, 100% 76%, 96% 92%, 80% 100%, 62% 91%, 45% 100%, 28% 93%, 9% 100%, 2% 80%, 5% 58%, 0% 38%);
    color:#fff;font-family:'Anton',sans-serif;letter-spacing:1px;text-transform:uppercase;
    margin-bottom:18px;font-size:15px;align-self:flex-start;
  }
  .menu-visual-torn input{
    background:transparent;border:none;color:#fff;font-family:inherit;font-size:inherit;
    letter-spacing:inherit;text-transform:inherit;width:100%;min-width:120px;
  }
  .menu-visual-torn input:focus{outline:1px dashed rgba(255,255,255,.6);}
  .menu-visual-note{
    font-size:12.5px;color:var(--text-dim);margin:2px 0 10px;line-height:1.55;
  }
  .menu-visual-note input{
    background:transparent;border:none;border-bottom:1px dashed rgba(245,236,217,.25);
    color:var(--text-dim);font-family:inherit;font-size:inherit;width:100%;padding:2px 0;
  }
  .menu-visual-row{
    display:flex;align-items:baseline;gap:8px;padding:9px 0;flex-wrap:wrap;
    border-bottom:1px dashed rgba(245,236,217,.14);
  }
  .menu-visual-row:last-of-type{border-bottom:none;}
  .menu-visual-row input.item-name{
    font-weight:700;font-size:14.5px;background:transparent;border:none;color:var(--text);
    font-family:inherit;flex:1;min-width:0;
  }
  .menu-visual-row input.item-name:focus{outline:1px dashed rgba(245,236,217,.4);}
  .menu-visual-row .filler{flex:0 0 20px;border-bottom:2px dotted rgba(245,236,217,.22);transform:translateY(-3px);}
  .menu-visual-row .price-display{
    font-weight:800;color:var(--orange-light);font-size:14.5px;white-space:nowrap;opacity:.75;
  }
  .menu-visual-flavours{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .menu-visual-flavours input{
    font-size:11.5px;font-weight:700;background:rgba(255,107,0,.1);
    border:1px solid rgba(255,107,0,.3);color:var(--orange-light);padding:5px 10px;
    border-radius:100px;text-transform:uppercase;letter-spacing:.3px;
    font-family:inherit;width:auto;min-width:60px;
  }
  .menu-visual-feast{
    background:linear-gradient(120deg, var(--red-dark), var(--brown) 55%);
    border:1px solid rgba(255,171,77,.3);border-radius:var(--radius);
    padding:34px;margin-bottom:24px;
  }
  .menu-visual-feast input.feast-heading{
    font-family:'Anton',sans-serif;font-size:clamp(24px,3vw,32px);color:#fff;
    background:transparent;border:none;margin-bottom:10px;width:100%;text-transform:uppercase;
  }
  .menu-visual-feast input.feast-eyebrow{
    font-weight:700;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--orange-light);background:transparent;border:none;width:100%;margin-bottom:6px;
  }
  .menu-visual-feast textarea.feast-items{
    color:rgba(245,236,217,.85);font-size:14px;line-height:1.7;background:transparent;
    border:1px dashed rgba(245,236,217,.2);border-radius:8px;width:100%;padding:8px;
    font-family:inherit;min-height:80px;
  }
  .menu-visual-footnote{
    display:flex;align-items:center;gap:12px;padding:18px 22px;
    background:rgba(245,236,217,.04);border:1px solid rgba(245,236,217,.1);
    border-radius:12px;font-size:13.5px;color:var(--text-dim);
  }
  .menu-visual-footnote textarea{
    background:transparent;border:none;color:var(--text-dim);font-family:inherit;
    font-size:inherit;width:100%;resize:vertical;min-height:40px;
  }
  .price-note{
    font-size:11px;color:var(--text-dim);opacity:.7;font-style:italic;margin-top:16px;
  }
  .price-edit-group{
    display:flex;align-items:center;gap:6px;flex:0 0 auto;
  }
  .price-edit-group input{
    width:64px;font-weight:800;color:var(--orange-light);font-size:14.5px;
    background:rgba(255,107,0,.08);border:1px solid rgba(255,107,0,.3);
    border-radius:6px;padding:4px 6px;font-family:inherit;text-align:right;
  }
  .price-update-btn{
    background:var(--orange);color:#fff;border:none;border-radius:6px;
    padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .price-update-btn:hover{background:var(--orange-light);}
  .price-update-btn:disabled{opacity:.6;cursor:default;}
  .price-status{
    font-size:11px;color:var(--text-dim);flex-basis:100%;margin-top:2px;
  }

  /* ---- Visual Collection Editor (mirrors the real order form styling) ---- */
  .col-jump-row{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    background:var(--charcoal);border:1px solid var(--brown-light);border-radius:10px;
    padding:12px 16px;position:sticky;top:0;z-index:5;
  }
  .col-jump-select{
    flex:1;background:var(--brown);border:1px solid var(--brown-light);border-radius:8px;
    color:var(--text);font-family:inherit;font-size:13.5px;padding:8px 10px;
  }
  .col-visual-card{
    border:1px solid var(--brown-light);border-radius:var(--radius);
    overflow:hidden;margin-bottom:20px;
  }
  .col-visual-head{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--brown);border-bottom:1px solid var(--brown-light);
    flex-wrap:wrap;
  }
  .col-visual-head input.col-label-input{
    font-weight:700;font-size:13px;background:transparent;border:none;
    color:var(--text);font-family:inherit;flex:1;min-width:120px;
  }
  .col-visual-head input.col-badge-input{
    font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    padding:4px 8px;border-radius:4px;background:rgba(255,107,0,.15);
    color:var(--orange-light);border:1px solid rgba(255,107,0,.3);font-family:inherit;
    width:180px;
  }
  .col-visual-item{
    display:flex;align-items:center;gap:12px;padding:13px 16px;
    border-bottom:1px solid rgba(245,236,217,.06);background:var(--ink);flex-wrap:wrap;
  }
  .col-visual-item-info{flex:1;min-width:160px;}
  .col-visual-item-info input.col-item-name-input{
    font-size:14px;font-weight:600;background:transparent;border:none;
    color:var(--text);font-family:inherit;width:100%;margin-bottom:4px;
  }
  .col-visual-item-info input.col-item-sub-input{
    font-size:12px;color:var(--text-dim);background:transparent;border:none;
    font-family:inherit;width:100%;
  }
  .col-visual-groups{
    padding:12px 16px 14px;background:rgba(255,107,0,.04);
    border-bottom:1px solid rgba(245,236,217,.06);
  }
  .col-visual-group-for{
    font-size:11px;font-weight:800;color:var(--cream);background:rgba(245,236,217,.08);
    display:inline-block;padding:3px 9px;border-radius:5px;margin-bottom:8px;
  }
  .col-visual-group-label{
    font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--orange-light);margin-bottom:6px;
  }
  .col-visual-group-label input{
    background:transparent;border:none;color:inherit;font-family:inherit;
    font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;width:100%;
  }
  .col-visual-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .col-visual-chips input{
    font-size:12px;font-weight:600;padding:6px 13px;border-radius:100px;
    border:1px solid rgba(245,236,217,.18);color:var(--text-dim);
    background:var(--brown);font-family:inherit;width:auto;min-width:70px;
  }
  .remove-item-btn{
    background:transparent;color:#e05c4a;border:1px solid rgba(224,92,74,.4);
    border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;
    cursor:pointer;white-space:nowrap;
  }
  .remove-item-btn:hover{background:rgba(224,92,74,.12);}
  .add-item-form{
    padding:14px 16px 16px;background:rgba(245,236,217,.03);
    border-top:1px dashed rgba(245,236,217,.12);
  }
  .add-item-row{display:flex;gap:8px;margin-bottom:8px;}
  .add-item-name{flex:1;}
  .add-item-price{width:110px;}
  .add-item-form input, .add-item-form select{
    background:var(--brown);border:1px solid var(--brown-light);border-radius:8px;
    color:var(--text);font-family:inherit;font-size:13px;padding:9px 11px;
  }
  .add-item-category{width:100%;margin-bottom:8px;}
  .add-item-btn{
    background:var(--orange);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .add-item-btn:hover{background:var(--orange-light);}
  .add-item-status{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .make-orderable-row{
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:6px 0 10px;border-bottom:1px dashed rgba(245,236,217,.14);
  }
  .make-orderable-row select, .make-orderable-row input[type="text"]{
    background:var(--brown);border:1px solid var(--brown-light);border-radius:6px;
    color:var(--text);font-family:inherit;font-size:11.5px;padding:6px 8px;flex:1;min-width:140px;
  }
  .make-orderable-btn{
    background:rgba(255,107,0,.15);color:var(--orange-light);border:1px solid rgba(255,107,0,.4);
    border-radius:6px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .make-orderable-btn:hover{background:rgba(255,107,0,.28);}
  .make-orderable-status{font-size:11px;color:var(--text-dim);flex-basis:100%;}

  /* ---- Visual Reviews Editor (mirrors the real light "paper" theme) ---- */
  .reviews-visual-wrap{
    background:var(--paper);color:var(--text-on-paper);border-radius:var(--radius);
    padding:32px;margin-bottom:10px;
  }
  .reviews-visual-eyebrow-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .reviews-visual-eyebrow-row::before{content:"";width:18px;height:2px;background:var(--red);flex-shrink:0;}
  .reviews-visual-eyebrow-row input{
    background:transparent;border:none;color:var(--red);font-weight:700;
    font-size:12.5px;letter-spacing:2px;text-transform:uppercase;font-family:inherit;width:100%;
  }
  .reviews-visual-heading{
    display:block;font-family:'Anton',sans-serif;font-size:28px;line-height:1.1;color:var(--text-on-paper);
    background:transparent;border:none;width:100%;margin-bottom:18px;text-transform:uppercase;
  }
  .reviews-visual-rating-row{display:flex;align-items:center;gap:18px;margin-bottom:24px;}
  .reviews-visual-rating-num{
    font-family:'Anton',sans-serif;font-size:48px;line-height:1;color:var(--text-on-paper);
    background:transparent;border:none;width:90px;
  }
  .reviews-visual-rating-meta-col .stars{color:var(--gold);font-size:16px;letter-spacing:2px;display:block;}
  .reviews-visual-rating-meta-col input{
    color:var(--text-on-paper-dim);font-size:13px;font-weight:600;background:transparent;
    border:none;border-bottom:1px dashed rgba(42,29,18,.25);font-family:inherit;width:220px;margin-top:2px;
  }
  .reviews-visual-cards-grid{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:18px;margin-bottom:20px;
  }
  .reviews-visual-card{
    background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:20px;
    box-shadow:0 14px 30px -18px rgba(42,29,18,.25);
  }
  .reviews-visual-card .stars{color:var(--gold);font-size:14px;letter-spacing:2px;display:block;margin-bottom:10px;}
  .reviews-visual-card textarea{
    width:100%;font-size:14px;line-height:1.6;color:var(--text-on-paper);font-weight:500;
    background:transparent;border:1px dashed rgba(42,29,18,.15);border-radius:6px;padding:8px;
    font-family:inherit;min-height:70px;margin-bottom:10px;resize:vertical;
  }
  .reviews-visual-card input.who-input{
    font-size:12.5px;color:var(--text-on-paper-dim);font-weight:700;background:transparent;
    border:none;width:100%;
  }
  .reviews-visual-summary{
    background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:20px 22px;
  }
  .reviews-visual-summary input.summary-label-input{
    font-weight:700;color:var(--text-on-paper);background:transparent;border:none;
    font-family:inherit;font-size:14.5px;width:220px;margin-bottom:6px;display:block;
  }
  .reviews-visual-summary textarea{
    width:100%;font-size:14.5px;line-height:1.7;color:var(--text-on-paper-dim);
    background:transparent;border:1px dashed rgba(42,29,18,.15);border-radius:6px;padding:8px;
    font-family:inherit;min-height:60px;resize:vertical;
  }

  /* ---- Visual Visit Editor (mirrors the real "Come say hi" section) ---- */
  .visit-visual-wrap{
    background:var(--ink);border:1px solid var(--brown-light);border-radius:var(--radius);
    padding:32px;margin-bottom:10px;
  }
  .visit-visual-info-item{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px;}
  .visit-visual-ico{
    width:42px;height:42px;border-radius:11px;background:rgba(255,107,0,.1);
    border:1px solid rgba(255,107,0,.3);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:18px;
  }
  .visit-visual-info-col{flex:1;}
  .visit-visual-info-col .info-label{
    font-weight:800;font-size:13px;color:var(--text);margin-bottom:4px;
  }
  .visit-visual-info-col input, .visit-visual-info-col textarea{
    width:100%;color:var(--text-dim);font-size:14px;line-height:1.6;background:transparent;
    border:1px dashed rgba(245,236,217,.15);border-radius:6px;padding:6px 8px;font-family:inherit;
  }
  .visit-visual-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .visit-visual-buttons input{
    font-family:inherit;font-weight:700;font-size:13px;border-radius:100px;
    padding:11px 18px;border:2px solid transparent;text-align:center;
  }
  .visit-visual-buttons input.cta-primary{
    background:linear-gradient(135deg,var(--orange) 0%, var(--red) 100%);color:#fff;
  }
  .visit-visual-buttons input.cta-outline{
    background:transparent;border-color:rgba(245,236,217,.35);color:var(--text);
  }

  /* ---- Visual Footer Editor (mirrors the real footer) ---- */
  .footer-visual-wrap{
    background:var(--ink);border:1px solid var(--brown-light);border-radius:var(--radius);
    padding:32px;margin-bottom:10px;
  }
  .footer-visual-top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;

  .hero-visual-chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
  .hero-visual-chips input{

  .hero-visual-medal-wrap{

<body class="login-mode">

  <div class="card" id="loginCard">
    <div class="eyebrow">Big Mama's Grill</div>
    <h1>Admin Login</h1>
    <p class="sub">Enter the password to manage your site.</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Log In</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <div class="dashboard dashboard-placeholder" id="dashboardCard">
    <div class="dash-header">
      <div>
        <div class="eyebrow" style="margin:0;">Big Mama's Grill</div>
        <h1 style="font-size:22px;">Site Editor</h1>
      </div>
      <button id="logoutBtn" class="btn-secondary">Log Out</button>
    </div>

    <div class="dash-body">
      <nav class="dash-nav" id="dashNav"></nav>
      <div class="dash-content" id="dashContent">
        <p class="sub">Choose a section on the left to edit it.</p>
      </div>
    </div>

    <div class="save-banner" id="saveBanner"></div>
  </div>

<script>
  const BACKEND_URL = 'https://bigmamas-backend.bigmamasgrillltd.workers.dev';

  const loginCard = document.getElementById('loginCard');
  const dashboardCard = document.getElementById('dashboardCard');
  const loginForm = document.getElementById('loginForm');
  const passwordInput = document.getElementById('passwordInput');
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const dashNav = document.getElementById('dashNav');
  const dashContent = document.getElementById('dashContent');
  const saveBanner = document.getElementById('saveBanner');

  let siteContent = null;
  let currentSection = null;

  function getSession() {
    const stored = localStorage.getItem('bmg_admin_session');
    if (!stored) return null;
    try {
      const session = JSON.parse(stored);
      if (session.exp && Date.now() < session.exp) return session;
      localStorage.removeItem('bmg_admin_session');
      return null;
    } catch {
      localStorage.removeItem('bmg_admin_session');
      return null;
    }
  }

  function showDashboard() {
    document.body.classList.remove('login-mode');
    loginCard.style.display = 'none';
    dashboardCard.style.display = 'block';
    loadDashboard();
  }

  function showLogin() {
    document.body.classList.add('login-mode');
    dashboardCard.style.display = 'none';
    loginCard.style.display = 'block';
  }

  function showBanner(message, isError) {
    saveBanner.textContent = message;
    saveBanner.className = 'save-banner' + (isError ? ' error-banner' : '');
    saveBanner.style.display = 'block';
    setTimeout(() => { saveBanner.style.display = 'none'; }, 3000);
  }

  // ---- SECTION DEFINITIONS ----
  // Each section knows how to (a) render a form from the current data and
  // (b) read the form back into the same shape, so saving is generic.
  const sections = [
    {
      id: 'header', label: '1. Header (Navigation Menu)',
      render(data) {
        const labels = data.nav_labels || [];
        return `
          <div class="header-visual-bar">
            <div class="header-visual-brand">
              <div class="header-visual-logo-wrap">
                <img src="${BACKEND_URL}/images/header-logo?v=${Date.now()}"
                     onerror="this.style.display='none'; this.parentElement.querySelector('.gallery-visual-noimg').style.display='flex';">
                <div class="gallery-visual-noimg" style="display:none;">No logo yet</div>
                <input type="file" accept="image/*" class="image-upload-input" data-image-key="header-logo" title="Change logo">
              </div>
              <div class="header-visual-brand-col">
                <input type="text" class="brand-text-input" data-field="brand_text" value="${escapeAttr(data.brand_text || '')}">
              </div>
            </div>
            <div class="header-visual-nav">
              ${labels.map((label, i) => `<input type="text" data-nav-label="${i}" value="${escapeAttr(label || '')}">`).join('')}
            </div>
            <div class="header-visual-cta">
              <input type="text" class="cta-outline" data-field="cta_directions" value="${escapeAttr(data.cta_directions || '')}">
              <input type="text" class="cta-primary" data-field="cta_order" value="${escapeAttr(data.cta_order || '')}">
            </div>
            <div class="image-upload-status header-visual-status" data-status-for="header-logo"></div>
          </div>
          <p class="price-note">This also updates the mobile menu automatically — no need to edit it separately.</p>`;
      },
      collect(container, data) {
        const nav_labels = (data.nav_labels || []).map((_, i) => container.querySelector(`[data-nav-label="${i}"]`).value);
        return {
          nav_labels,
          cta_directions: container.querySelector('[data-field="cta_directions"]').value,
          cta_order: container.querySelector('[data-field="cta_order"]').value,
          brand_text: container.querySelector('[data-field="brand_text"]').value,
        };
      },
    },
    {
      id: 'hero', label: '2. Hero (Top Banner)',
      render(data) {
        return `
          <div class="hero-visual-wrap">
            <div class="hero-visual-ribbon">
              <input type="text" data-field="ribbon" value="${escapeAttr(data.ribbon || '')}">
            </div>
            <input type="text" class="hero-visual-heading" data-heading-line="1" value="${escapeAttr(parseHeroHeading(data.heading_html).line1)}">
            <input type="text" class="hero-visual-heading" data-heading-line="2" value="${escapeAttr(parseHeroHeading(data.heading_html).line2)}">
            <input type="text" class="hero-visual-heading" style="color:var(--orange-light);" data-heading-line="3" value="${escapeAttr(parseHeroHeading(data.heading_html).line3)}">
            <textarea class="hero-visual-sub" data-field="subtext">${escapeHtml(data.subtext || '')}</textarea>

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }
  // Strips tags and decodes entities (like <b>Fried</b> or "salt &amp; pepper")
  // down to plain readable text, so stored HTML shows normally in a text
  // field instead of showing the literal markup characters.
  function stripSimpleTags(html) {
    const tmp = document.createElement('textarea');
    tmp.innerHTML = String(html).replace(/<[^>]+>/g, '');
    return tmp.value;
  }

  // The hero heading is always 3 lines, with the last line coloured — parse
  // it into plain editable lines, and rebuild the same structure on save.
  function parseHeroHeading(html) {
    const parts = String(html || '').split(/<br\s*\/?>/i);
    const line1 = stripSimpleTags(parts[0] || '');
    const line2 = stripSimpleTags(parts[1] || '');
    const line3 = stripSimpleTags(parts[2] || '');
    return { line1, line2, line3 };
  }
  function buildHeroHeading(line1, line2, line3) {
    return `${escapeHtml(line1)}<br>${escapeHtml(line2)}<br><span class="accent">${escapeHtml(line3)}</span>`;
  }

  // The reviews summary is always "<b>Label:</b> rest of text" — split it
  // into a plain bold-label field and a plain rest-of-text field, so
  // editing it can't accidentally lose the bold formatting.
  function parseSummary(html) {
    const m = String(html || '').match(/^<b>(.*?)<\/b>\s*(.*)$/s);
    if (m) return { label: stripSimpleTags(m[1]), rest: stripSimpleTags(m[2]) };
    return { label: '', rest: stripSimpleTags(html || '') };
  }
  function buildSummary(label, rest) {
    return label ? `<b>${escapeHtml(label)}</b> ${escapeHtml(rest)}` : escapeHtml(rest);
  }

  // Renders a labeled "choose photo" control for one swappable image slot.
  // `key` must match one of the keys the backend's SITE_IMAGES storage uses
  // (see IMAGE_KEY_MAP in index.html) so the upload actually lands on the
  // right photo.
  function imageUploadField(key, label) {
    return `
      <div class="field-group">
        <label class="field-label">${escapeHtml(label)}</label>
        <input type="file" accept="image/*" class="image-upload-input" data-image-key="${escapeAttr(key)}">
        <div class="image-upload-status" data-status-for="${escapeAttr(key)}" style="font-size:12px;color:var(--text-dim);margin-top:4px;"></div>
      </div>`;
  }

  async function handleImageUpload(fileInput) {
    const key = fileInput.dataset.imageKey;
    const file = fileInput.files[0];
    if (!file) return;
    const statusEl = document.querySelector(`[data-status-for="${key}"]`);

    if (file.size > 6 * 1024 * 1024) {
      if (statusEl) statusEl.textContent = 'That photo is too large — please use one under 6MB.';
      return;
    }

    if (statusEl) statusEl.textContent = 'Uploading...';

    const session = getSession();
    if (!session) { showLogin(); return; }

    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const base64 = dataUrl.split(',')[1];

      const res = await fetch(BACKEND_URL + '/admin/upload-image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ key, content_type: file.type, data_base64: base64 }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        if (statusEl) statusEl.textContent = result.error || 'Could not upload photo';
      } else {
        if (statusEl) statusEl.textContent = 'Photo updated — check the live site to confirm.';
        showBanner('Photo saved!');
        // Update any live preview right away, using the file we already have
        // in memory — no need to wait on a fresh fetch or a page reload.
        const card = fileInput.closest('.gallery-visual-card') || fileInput.parentElement;
        if (card) {
          const previewImg = card.querySelector('img');
          if (previewImg) {
            previewImg.src = dataUrl;
            previewImg.style.display = '';
          }
          const noImgEl = card.querySelector('.gallery-visual-noimg');
          if (noImgEl) noImgEl.style.display = 'none';
        }
      }
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Could not reach the server';
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('price-update-btn')) {
      handlePriceUpdate(e.target);
    }
    if (e.target.classList && e.target.classList.contains('remove-item-btn')) {
      if (e.target.dataset.removeKey) handleRemoveItem(e.target);
      if (e.target.dataset.removeMenuOnly) handleRemoveMenuOnlyItem(e.target);
    }
    if (e.target.classList && e.target.classList.contains('add-item-btn')) {
      if (e.target.dataset.addItemSec !== undefined) handleAddItem(e.target);
      if (e.target.dataset.addMenuItem !== undefined) handleAddMenuOnlyItem(e.target);
    }
    if (e.target.classList && e.target.classList.contains('gallery-visual-remove-btn')) {
      handleRemoveGalleryPhoto(e.target);
    }
    if (e.target.classList && e.target.classList.contains('add-gallery-btn')) {
      handleAddGalleryPhoto(e.target);
    }
    if (e.target.classList && e.target.classList.contains('make-orderable-btn')) {
      handleMakeOrderable(e.target);
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.classList && e.target.classList.contains('image-upload-input')) {
      handleImageUpload(e.target);
    }
    if (e.target.classList && e.target.classList.contains('make-orderable-section')) {
      const key = e.target.dataset.orderableSec;
      const newSecInput = document.querySelector(`[data-orderable-newsec="${key}"]`);
      if (newSecInput) newSecInput.style.display = e.target.value === 'new' ? 'block' : 'none';
    }
    if (e.target.id === 'colJumpSelect' && e.target.value) {
      const target = document.getElementById(e.target.value);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      e.target.value = '';
    }
  });

  async function handleRemoveGalleryPhoto(btn) {
    const index = btn.dataset.removeGalleryIndex;
    const item = siteContent.gallery.items[index];
    const caption = item ? item.caption : 'this photo';
    if (!confirm(`Remove "${caption}" from the gallery? This can't be undone.`)) return;

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = '...';

    try {
      const res = await fetch(BACKEND_URL + '/admin/remove-gallery-photo', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ index: parseInt(index, 10) }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        showBanner(result.error || 'Could not remove photo', true);
        btn.disabled = false;
        btn.textContent = 'Remove';
        return;
      }

      siteContent.gallery.items[index] = null;
      showBanner('Photo removed');
      selectSection('gallery');
    } catch (err) {
      showBanner('Could not reach the server', true);
      btn.disabled = false;
      btn.textContent = 'Remove';
    }
  }

  async function handleAddGalleryPhoto(btn) {
    const card = btn.closest('.gallery-visual-add-card');
    const captionInput = card.querySelector('.add-gallery-caption');
    const fileInput = card.querySelector('.add-gallery-file');
    const statusEl = card.querySelector('.gallery-visual-add-status');

    const caption = captionInput.value.trim();
    const file = fileInput.files[0];

    if (!caption) {
      statusEl.textContent = 'Enter a caption for the photo';
      return;
    }
    if (!file) {
      statusEl.textContent = 'Choose a photo to upload';
      return;
    }
    if (file.size > 6 * 1024 * 1024) {
      statusEl.textContent = 'That photo is too large — please use one under 6MB';
      return;
    }

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Adding...';
    statusEl.textContent = '';

    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const base64 = dataUrl.split(',')[1];

      const res = await fetch(BACKEND_URL + '/admin/add-gallery-photo', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ caption, content_type: file.type, data_base64: base64 }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        statusEl.textContent = result.error || 'Could not add photo';
        return;
      }

      if (!siteContent.gallery.items) siteContent.gallery.items = [];
      siteContent.gallery.items[result.index] = { caption, alt: caption };
      showBanner('Photo added!');
      selectSection('gallery');
    } catch (err) {
      statusEl.textContent = 'Could not reach the server';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Photo';
    }
  }


  async function handleMakeOrderable(btn) {
    const ci = btn.dataset.orderableCat;
    const ii = btn.dataset.orderableItem;
    const key = `${ci}-${ii}`;
    const select = document.querySelector(`[data-orderable-sec="${key}"]`);
    const newSecInput = document.querySelector(`[data-orderable-newsec="${key}"]`);
    const noteInput = document.querySelector(`[data-orderable-note="${key}"]`);
    const statusEl = document.querySelector(`[data-orderable-status="${key}"]`);

    const item = siteContent.menu.categories[ci].items[ii];
    const isNewSection = select.value === 'new';
    const newSectionName = newSecInput.value.trim();
    const note = noteInput.value.trim();

    if (isNewSection && !newSectionName) {
      statusEl.textContent = 'Enter a name for the new section';
      return;
    }
    if (!confirm(`Make "${item.name}" orderable? This creates a real Stripe product for it, using its current price (${item.price}).`)) return;

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Working...';
    statusEl.textContent = '';

    try {
      const payload = { category_index: parseInt(ci, 10), item_index: parseInt(ii, 10) };
      if (isNewSection) payload.new_section_label = newSectionName;
      else payload.section_index = parseInt(select.value, 10);
      if (note) payload.sub_note = note;

      const res = await fetch(BACKEND_URL + '/admin/make-orderable', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify(payload),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        statusEl.textContent = result.error || 'Could not make this item orderable';
        return;
      }

      // Mirror the change in our in-memory copy.
      item.key = result.key;
      if (!siteContent.collection.items) siteContent.collection.items = {};
      siteContent.collection.items[result.key] = { name: item.name, sub_note: note || null, price: item.price };
      if (isNewSection) {
        siteContent.collection.sections.push({ label: newSectionName, badge: '', item_keys: [result.key], group_keys: [] });
      } else {
        siteContent.collection.sections[result.section_index].item_keys.push(result.key);
      }

      showBanner('Now orderable through Collection!');
      selectSection('menu');
    } catch (err) {
      statusEl.textContent = 'Could not reach the server';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Make Orderable';
    }
  }


  async function handleRemoveMenuOnlyItem(btn) {
    const [ci, ii] = btn.dataset.removeMenuOnly.split('-').map(Number);
    const item = siteContent.menu.categories[ci].items[ii];
    if (!confirm(`Remove "${item.name}" from the menu? This can't be undone.`)) return;

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Removing...';

    try {
      const res = await fetch(BACKEND_URL + '/admin/remove-item', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ category_index: ci, item_index: ii }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        showBanner(result.error || 'Could not remove item', true);
        btn.disabled = false;
        btn.textContent = 'Remove';
        return;
      }

      siteContent.menu.categories[ci].items.splice(ii, 1);
      showBanner('Item removed');
      selectSection('menu');
    } catch (err) {
      showBanner('Could not reach the server', true);
      btn.disabled = false;
      btn.textContent = 'Remove';
    }
  }

  async function handleAddMenuOnlyItem(btn) {
    const ci = btn.dataset.addMenuItem;
    const nameInput = document.querySelector(`[data-add-menu-name="${ci}"]`);
    const priceInput = document.querySelector(`[data-add-menu-price="${ci}"]`);
    const statusEl = document.querySelector(`[data-add-menu-status-for="${ci}"]`);

    const name = nameInput.value.trim();
    const pounds = parseFloat(priceInput.value.replace('£', '').trim());

    if (!name) {
      if (statusEl) statusEl.textContent = 'Enter a name for the item';
      return;
    }
    if (isNaN(pounds) || pounds <= 0) {
      if (statusEl) statusEl.textContent = 'Enter a valid price, e.g. 4.50';
      return;
    }

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Adding...';
    if (statusEl) statusEl.textContent = '';

    try {
      const res = await fetch(BACKEND_URL + '/admin/add-item', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({
          category_index: parseInt(ci, 10),
          name,
          price_pounds: pounds,
          orderable: false,
        }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        if (statusEl) statusEl.textContent = result.error || 'Could not add item';
        return;
      }

      siteContent.menu.categories[parseInt(ci, 10)].items.push({ name, price: '£' + pounds.toFixed(2) });
      showBanner('Item added!');
      selectSection('menu');
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Could not reach the server';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Item';
    }
  }

  async function handleRemoveItem(btn) {
    const key = btn.dataset.removeKey;
    const item = siteContent.collection.items[key];
    const name = item ? item.name : 'this item';
    if (!confirm(`Remove "${name}" completely? This can't be undone — it'll disappear from Collection and Menu, and can never be charged again.`)) {
      return;
    }

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Removing...';

    try {
      const res = await fetch(BACKEND_URL + '/admin/remove-item', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ key }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        showBanner(result.error || 'Could not remove item', true);
        btn.disabled = false;
        btn.textContent = 'Remove';
        return;
      }

      // Mirror the removal in our in-memory copy so the screen updates
      // immediately without needing a full reload.
      delete siteContent.collection.items[key];
      siteContent.collection.sections.forEach((sec) => {
        sec.item_keys = (sec.item_keys || []).filter((k) => k !== key);
      });
      siteContent.menu.categories.forEach((cat) => {
        cat.items = (cat.items || []).filter((item) => item.key !== key);
      });

      showBanner('Item removed');
      selectSection('collection');
    } catch (err) {
      showBanner('Could not reach the server', true);
      btn.disabled = false;
      btn.textContent = 'Remove';
    }
  }

  async function handleAddItem(btn) {
    const si = btn.dataset.addItemSec;
    const nameInput = document.querySelector(`[data-add-name-sec="${si}"]`);
    const priceInput = document.querySelector(`[data-add-price-sec="${si}"]`);
    const noteInput = document.querySelector(`[data-add-note-sec="${si}"]`);
    const categorySelect = document.querySelector(`[data-add-category-sec="${si}"]`);
    const statusEl = document.querySelector(`[data-add-status-for="${si}"]`);

    const name = nameInput.value.trim();
    const pounds = parseFloat(priceInput.value.replace('£', '').trim());
    const note = noteInput.value.trim();
    const categoryValue = categorySelect.value;

    if (!name) {
      if (statusEl) statusEl.textContent = 'Enter a name for the item';
      return;
    }
    if (isNaN(pounds) || pounds <= 0) {
      if (statusEl) statusEl.textContent = 'Enter a valid price, e.g. 4.50';
      return;
    }

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Adding...';
    if (statusEl) statusEl.textContent = '';

    try {
      const res = await fetch(BACKEND_URL + '/admin/add-item', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({
          category_index: categoryValue === '' ? null : parseInt(categoryValue, 10),
          name,
          price_pounds: pounds,
          orderable: true,
          section_index: parseInt(si, 10),
          sub_note: note || null,
        }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        if (statusEl) statusEl.textContent = result.error || 'Could not add item';
        return;
      }

      // Mirror the new item in our in-memory copy.
      const displayPrice = '£' + pounds.toFixed(2);
      siteContent.collection.items[result.key] = { name, sub_note: note || null, price: displayPrice };
      siteContent.collection.sections[parseInt(si, 10)].item_keys.push(result.key);
      if (categoryValue !== '') {
        siteContent.menu.categories[parseInt(categoryValue, 10)].items.push({ name, price: displayPrice, key: result.key });
      }

      showBanner('Item added!');
      selectSection('collection');
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Could not reach the server';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Item';
    }
  }

  async function handlePriceUpdate(btn) {
    const key = btn.dataset.priceUpdateKey;
    const input = document.querySelector(`[data-price-input-key="${key}"]`);
    const statusEl = document.querySelector(`[data-price-status-for="${key}"]`);
    if (!input) return;

    const rawValue = input.value.replace('£', '').trim();
    const pounds = parseFloat(rawValue);
    if (isNaN(pounds) || pounds <= 0) {
      if (statusEl) statusEl.textContent = 'Enter a valid price, e.g. 9.99';
      return;
    }

    const session = getSession();
    if (!session) { showLogin(); return; }

    btn.disabled = true;
    btn.textContent = 'Updating...';
    if (statusEl) statusEl.textContent = '';

    try {
      const res = await fetch(BACKEND_URL + '/admin/update-price', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ key, new_price_pounds: pounds }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        if (statusEl) statusEl.textContent = result.error || 'Could not update price';
      } else {
        input.value = pounds.toFixed(2);
        // Keep our in-memory copy of the content in sync, so switching away
        // from Menu and back (or a later bulk save) doesn't show stale data.
        if (siteContent.menu) {
          siteContent.menu.categories.forEach((cat) => {
            (cat.items || []).forEach((item) => {
              if (item.key === key) item.price = result.display_price;
            });
          });
        }
        if (siteContent.collection && siteContent.collection.items && siteContent.collection.items[key]) {
          siteContent.collection.items[key].price = result.display_price;
        }
        if (statusEl) statusEl.textContent = 'Updated — now ' + result.display_price + ' everywhere.';
        showBanner('Price updated!');
      }
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Could not reach the server';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Update';
    }
  }

  async function loadDashboard() {
    dashNav.innerHTML = sections.map(s =>
      `<button data-section="${s.id}">${s.label}</button>`
    ).join('');

    dashNav.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => selectSection(btn.dataset.section));
    });

    try {
      const res = await fetch(BACKEND_URL + '/content');
      siteContent = await res.json();
    } catch (err) {
      dashContent.innerHTML = '<p class="sub">Could not load site content. Check your connection and refresh.</p>';
    }
  }

  function selectSection(id) {
    currentSection = id;
    dashNav.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.section === id);
    });

    const section = sections.find(s => s.id === id);
    const data = siteContent[id] || {};
    dashContent.innerHTML = `
      <h2 style="font-size:18px;margin-top:0;">${section.label}</h2>
      <div id="sectionForm">${section.render(data)}</div>
      <button class="save-btn" id="saveSectionBtn">Save Changes</button>
    `;

    document.getElementById('saveSectionBtn').addEventListener('click', () => saveSection(section));
  }

  async function saveSection(section) {
    const btn = document.getElementById('saveSectionBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const formContainer = document.getElementById('sectionForm');
    const currentData = siteContent[section.id] || {};
    const updatedData = section.collect(formContainer, currentData);

    const session = getSession();
    if (!session) {
      showLogin();
      return;
    }

    try {
      const res = await fetch(BACKEND_URL + '/admin/content', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.token,
        },
        body: JSON.stringify({ section: section.id, data: updatedData }),
      });

      if (res.status === 401) {
        localStorage.removeItem('bmg_admin_session');
        showLogin();
        return;
      }

      const result = await res.json();
      if (!res.ok) {
        showBanner(result.error || 'Could not save changes', true);
      } else {
        siteContent[section.id] = updatedData;
        showBanner('Saved!');
      }
    } catch (err) {
      showBanner('Could not reach the server', true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  }

  // Check for an existing, still-valid session on page load so a refresh
  // doesn't force Shadé/Kev to log in again every time.
  function checkExistingSession() {
    if (getSession()) {
      showDashboard();
    } else {
      showLogin();
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
      const res = await fetch(BACKEND_URL + '/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error || 'Incorrect password';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
        return;
      }

      const payload = JSON.parse(atob(data.token.split('.')[0]));
      localStorage.setItem('bmg_admin_session', JSON.stringify({
        token: data.token,
        exp: payload.exp,
      }));

      passwordInput.value = '';
      showDashboard();
    } catch (err) {
      errorMsg.textContent = 'Could not reach the server. Check your connection and try again.';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    }
  });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('bmg_admin_session');
    showLogin();
  });

  checkExistingSession();
</script>

</body>
</html>
